{% extends "clientes/base.html" %}

{% block content %}
<div class="wrapper">
    <div class="card form-card">
        <div class="card-header">
            <h2 class="title">Confirmar Eliminación</h2>
        </div>
        <div class="card-body">
            <p>¿Estás seguro que deseas eliminar al trabajador <strong>{{ trabajador }}</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn">Sí, eliminar</button>
                <a href="{% url 'listar_trabajadores' trabajador.empresa.id %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>



<style>
.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 2rem;
    font-family: 'Poppins', sans-serif;
    background-color: #111;
}

.card.delete-card {
    background-color: #111;
    border: 0.125rem solid #fff;
    border-radius: 0.625rem;
    padding: 2rem;
    width: 100%;
    max-width: 31.25rem;
    box-shadow: 0.25rem 0.25rem #fff;
    color: #fff;
}

.title {
    font-size: 1.8rem;
    font-weight: 700;
}

p {
    color: #ccc;
}

.text-danger {
    color: #f44336;
    font-weight: 600;
}

.btn {
    padding: 0.4rem 0.8rem;
    border: 2px solid #fff;
    border-radius: 5px;
    color: #ffffffff;
    background-color: transparent;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
    font-family: 'Poppins', sans-serif;

}

.btn:hover {
    background-color: #fff;
    color: #111;
    box-shadow: 2px 2px #fff;
}
.btn-secondary {
    border-color: #f44336;
    color: #f44336;
}

.btn-secondary:hover {
    background-color: #f44336;
    color: #fff;
    box-shadow: 2px 2px #f44336;
}
</style>
{% endblock %}
