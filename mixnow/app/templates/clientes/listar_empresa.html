{% extends "clientes/base.html" %}
{% load static %}

{% block content %}
<div class="wrapper">
    <div class="card-lista">
        <h2 class="title">Lista de Empresas</h2>

        {% if empresa %}
        <div class="cards-container">
            {% for e in empresa %}
            <div class="card">
                <h3 class="card-name">{{ e.nombre }}</h3>
                <a href="{% url 'listar_trabajadores' e.id %}" class="btn-ver">Ver Trabajadores</a>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p class="no-data">No hay empresas registradas</p>
        {% endif %}
    </div>
</div>
<style>
.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    font-family: 'Poppins', sans-serif;
    background-color: #111;
    min-height: 80vh;
    max-width: 105rem;
    margin: 0 auto;
}

.card-lista {
    background-color: #111;
    border: 0.125rem solid #fff;
    border-radius: 0.625rem;
    padding: 2rem;
    box-shadow: 0.25rem 0.25rem #fff;
    color: #fff;
    max-width: 100rem;
}

.title {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    text-align: center;
}

/* Contenedor de tarjetas */
.cards-container {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
}

/* Tarjeta individual */
.card {
    background-color: #222;
    border: 0.0625rem solid #fff;
    border-radius: 0.625rem;
    padding: 1rem;
    width: 12rem;
    text-align: center;
    box-shadow: 0.125rem 0.125rem #fff;
    transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0.25rem 0.25rem #f44336;
}

.card-img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 0.5rem;
    border: 0.0625rem solid #fff;
}

.card-name {
    font-size: 1.1rem;
    font-weight: 600;
}

/* Botón Ver Trabajadores */
.btn-ver {
    display: inline-block;
    margin-top: 0.8rem;
    padding: 0.5rem 1rem;
    background-color: #f44336;
    color: #fff;
    text-decoration: none;
    border-radius: 0.5rem;
    font-weight: 600;
    transition: background-color 0.3s, transform 0.2s;
}

.btn-ver:hover {
    background-color: #d32f2f;
    transform: scale(1.05);
}

/* Mensaje de no datos */
.no-data {
    text-align: center;
    padding: 1rem 0;
    color: #aaa;
}
</style>
{% endblock %}
